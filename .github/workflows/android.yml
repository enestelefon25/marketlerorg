name: Android derleme

on:
  push:
    paths:
      - "MarketlerAndroid/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MarketlerAndroid
    env:
      HAS_SIGNING_KEY: ${{ secrets.MARKETLER_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri, lint ve debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug

      - name: İmzalama anahtarını geçici dosyaya çıkar
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.MARKETLER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MARKETLER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        env:
          MARKETLER_KEYSTORE_PASSWORD: ${{ secrets.MARKETLER_KEYSTORE_PASSWORD }}
          MARKETLER_KEY_ALIAS: ${{ secrets.MARKETLER_KEY_ALIAS }}
          MARKETLER_KEY_PASSWORD: ${{ secrets.MARKETLER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Teslim dosyalarını hazırla
        run: |
          mkdir -p ../dist
          git -C .. archive --format=zip --prefix=MarketlerAndroid/ -o dist/MarketlerAndroid-Source.zip HEAD:MarketlerAndroid
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MarketlerAndroid-debug.apk
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist/MarketlerAndroid.apk
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs ../dist/MarketlerAndroid.apk
          else
            echo "::warning::İmzalama anahtarı tanımlı değil; imzalı release APK üretilmedi. README'deki 'GitHub ile imzalı APK' adımlarına bakın."
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: MarketlerAndroid
          path: dist/
          if-no-files-found: error
